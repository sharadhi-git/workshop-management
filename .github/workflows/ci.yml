name: Bicycle Workshop Management CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

        # Step 4: Run ESLint
      - name: Run lint checks
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build  

# Step 6: Check development server
      - name: Test Vite development server
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 --strictPort &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for i in {1..30}; do
            if curl --fail --silent \
              http://127.0.0.1:5173/ > /dev/null; then
              echo "Vite server is running"
              exit 0
            fi
            sleep 1
          done

          echo "Vite server failed to start"
          exit 1