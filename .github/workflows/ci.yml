name: Bicycle Workshop Management CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

        # Step 4: Run ESLint
      - name: Run lint checks
        run: npm run lint

    #   - name: Run tests
    #     run: npm test

      - name: Build project
        run: npm run build  

# Step 6: Check development server
      - name: Test Vite development server
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 --strictPort \
            > vite.log 2>&1 &

          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for i in {1..30}; do
            if curl --fail --silent \
              http://localhost:5173/ > /dev/null; then
              echo "Vite server started successfully"
              exit 0
            fi

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Vite process exited unexpectedly"
              cat vite.log
              exit 1
            fi

            sleep 1
          done

          echo "Vite server did not respond"
          cat vite.log
          exit 1